<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot KHAIRO TOURS - Uji Coba</title>
<style>
  :root {
    --green-800:#0e2e0e; --green-900:#0a1f0a; --gold-500:#D4AF37;
    --font:'Poppins',system-ui,sans-serif;
    --r-md:12px; --r-lg:16px; --r-pill:50px;
    --abu:#f4f6f5; --garis:#e3e7e5;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; font-family:var(--font); background:var(--abu);
    display:flex; justify-content:center; padding:24px;
  }
  .wrap { width:100%; max-width:430px; }
  header {
    background:var(--green-800); color:#fff; padding:16px 18px;
    border-bottom:2px solid var(--gold-500);
    border-radius:var(--r-lg) var(--r-lg) 0 0;
  }
  header h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:.2px; }
  header p { margin:4px 0 0; font-size:12.5px; opacity:.85; }
  #log {
    height:440px; overflow-y:auto; overscroll-behavior:contain;
    background:#fff; padding:14px;
    border-left:1px solid var(--garis); border-right:1px solid var(--garis);
  }
  .msg { max-width:82%; padding:9px 12px; border-radius:14px; margin-bottom:9px; font-size:14px; line-height:1.55; white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:#eef2f0; border-bottom-left-radius:4px; }
  .me { background:var(--green-800); color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
  .meta { text-align:center; font-size:11px; color:#8a9a94; margin:10px 0; }
  form { display:flex; gap:8px; padding:12px; background:#fff; border-radius:0 0 var(--r-lg) var(--r-lg); border:1px solid var(--garis); border-top:0; }
  input { flex:1; padding:11px 13px; border:1px solid #d6ddda; border-radius:var(--r-pill); font:inherit; font-size:14px; outline:none; }
  input:focus-visible { border-color:var(--green-700); outline:2px solid var(--gold-500); outline-offset:1px; }
  button { padding:11px 20px; border:0; border-radius:var(--r-pill); background:var(--green-800); color:var(--gold-500); font:inherit; font-size:14px; font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  button:hover { background:var(--green-700); }
  button:active { transform:scale(.96); }
  .chip { display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px 0; background:#fff; border-left:1px solid var(--garis); border-right:1px solid var(--garis); }
  .chip button { background:#eef2f0; color:var(--green-800); font-size:12.5px; padding:7px 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>KHAIRO TOURS &amp; TRAVELS</h1>
    <p>Asisten virtual &middot; PT. Khairo Wisata &middot; SK PPIU 1153/2019</p>
  </header>
  <div id="log"></div>
  <div class="chip" id="chip">
    <button type="button">Assalamualaikum</button>
    <button type="button">Paket termurah berapa?</button>
    <button type="button">Paket Mabrur</button>
    <button type="button">Syarat dokumen apa saja?</button>
    <button type="button">Berapa uang muka?</button>
    <button type="button">Mau bicara dengan Kak Lina</button>
  </div>
  <form id="f">
    <input id="inp" placeholder="Tulis pertanyaan..." autocomplete="off">
    <button type="submit">Kirim</button>
  </form>
</div>

<script>
const log = document.getElementById('log');
const inp = document.getElementById('inp');

function tambah(teks, sisi) {
  const d = document.createElement('div');
  d.className = 'msg ' + sisi;
  d.textContent = teks;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

async function kirim(pesan) {
  tambah(pesan, 'me');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pesan: pesan }),
    });
    const d = await r.json();
    setTimeout(() => tambah(d.teks || 'Maaf, ada gangguan.', 'bot'), 250);
    if (d.tipe) {
      const m = document.createElement('div');
      m.className = 'meta';
      m.textContent = 'tipe: ' + d.tipe;
      log.appendChild(m);
    }
  } catch (e) {
    tambah('Gagal menghubungi server.', 'bot');
  }
}

document.getElementById('f').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = inp.value.trim();
  if (!v) return;
  inp.value = '';
  kirim(v);
});

document.getElementById('chip').addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON') kirim(e.target.textContent);
});

tambah('Assalamualaikum, selamat datang di KHAIRO TOURS. Saya asisten virtual. Silakan tanya apa saja tentang paket umroh kami.', 'bot');
</script>
</body>
</html>
